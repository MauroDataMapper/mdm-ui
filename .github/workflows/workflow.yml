name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: MauroDataMapper/mauro-ci/.github/workflows/node-ci.yml@7f1066948f95a797f99a160545acf2b7145b886b
    with:
      node-version: "24.16.0"
      working-directory: .
      cache-dependency-path: package-lock.json
      linked-package-repository: ${{ github.ref != 'refs/heads/main' && 'MauroDataMapper/mdm-resources' || '' }}
      linked-package-ref: refs/heads/develop
      linked-package-path: mdm-resources
      linked-package-name: "@maurodatamapper/mdm-resources"
      linked-package-use-npm-ci: false
      verify-tools: |
        tsc
        jest
      verify-dependencies: |
        jsdom
        jest
        ts-jest
        @angular/core
      report-symlinked-names: true
      license-script: license-check
      license-argument: check
      test-executable: npx
      test-arguments: --no-install jest --coverage
      build-script: dist
      test-junit-path: test-report/junit.xml
      build-artifact-path: dist/*.tgz
      build-artifact-name: mdm-ui-dist-original

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      lint-junit-artifact-id: ${{ steps.upload-lint-junit.outputs.artifact-id }}
      sarif-artifact-id: ${{ steps.upload-sarif.outputs.artifact-id }}
    steps:
      - name: Checkout mdm-ui
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: MauroDataMapper/mauro-ci/actions/setup-node-npm@7f1066948f95a797f99a160545acf2b7145b886b
        with:
          node-version: "24.16.0"
          working-directory: .
          cache-dependency-path: package-lock.json

      - name: Run ESLint and generate JUnit results
        continue-on-error: true
        uses: MauroDataMapper/mauro-ci/actions/run-npm-script@7f1066948f95a797f99a160545acf2b7145b886b
        with:
          npm-script: eslint-junit
          working-directory: .

      - name: Upload ESLint JUnit results
        id: upload-lint-junit
        if: always()
        uses: MauroDataMapper/mauro-ci/actions/upload-junit-results@7f1066948f95a797f99a160545acf2b7145b886b
        with:
          artifact-name: lint-junit-results
          path: eslint/eslint-junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Generate ESLint SARIF
        id: eslint-sarif
        continue-on-error: true
        uses: MauroDataMapper/mauro-ci/actions/run-npm-script@7f1066948f95a797f99a160545acf2b7145b886b
        with:
          npm-script: eslint-sarif
          working-directory: .

      - name: Upload SARIF artifact
        id: upload-sarif
        if: >-
          always() &&
          (steps.eslint-sarif.outcome == 'success' ||
           steps.eslint-sarif.outcome == 'failure')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sarif-results
          path: eslint/eslint_report.sarif
          retention-days: 7
          if-no-files-found: warn

  build-nhs:
    needs: ci
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout mdm-ui
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: MauroDataMapper/mauro-ci/actions/setup-node-npm@7f1066948f95a797f99a160545acf2b7145b886b
        with:
          node-version: "24.16.0"
          working-directory: .
          cache-dependency-path: package-lock.json

      - name: Build distribution with NHS Digital theme
        uses: MauroDataMapper/mauro-ci/actions/run-npm-script@7f1066948f95a797f99a160545acf2b7145b886b
        with:
          npm-script: dist
          working-directory: .
        env:
          MDM_UI_THEME_NAME: nhs-digital

      - name: Upload NHS Digital distribution artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mdm-ui-dist-nhs
          path: dist/*.nhs-digital.tgz
          retention-days: 7
          if-no-files-found: error

  combine-distributions:
    needs: [ci, build-nhs]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mdm-ui-dist-*
          path: distribution
          merge-multiple: true

      - name: Upload combined distribution artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mdm-ui-dist
          path: distribution/*.tgz
          retention-days: 7
          if-no-files-found: error

  report-unit-tests:
    needs: ci
    if: >-
      always() &&
      needs.ci.outputs.unit-junit-artifact-id != '' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/develop')))
    permissions:
      actions: read
      checks: write
      contents: read
    uses: MauroDataMapper/mauro-ci/.github/workflows/junit-report.yml@7f1066948f95a797f99a160545acf2b7145b886b
    with:
      artifact-name: unit-junit-results
      report-name: Unit Test Results

  report-eslint:
    needs: lint
    if: >-
      always() &&
      needs.lint.outputs.lint-junit-artifact-id != '' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/develop')))
    permissions:
      actions: read
      checks: write
      contents: read
    uses: MauroDataMapper/mauro-ci/.github/workflows/junit-report.yml@7f1066948f95a797f99a160545acf2b7145b886b
    with:
      artifact-name: lint-junit-results
      report-name: ESLint Results

  upload-sarif:
    needs: lint
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.repository == 'MauroDataMapper/mdm-ui' &&
      needs.lint.outputs.sarif-artifact-id != '' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: MauroDataMapper/mauro-ci/.github/workflows/sarif-upload.yml@7f1066948f95a797f99a160545acf2b7145b886b
    with:
      artifact-name: sarif-results
      sarif-path: eslint_report.sarif
      category: ESLint

  publish:
    needs: [ci, lint, combine-distributions]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'MauroDataMapper/mdm-ui' &&
      needs.ci.result == 'success' &&
      needs.lint.result == 'success' &&
      needs.combine-distributions.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop')
    permissions:
      actions: read
      contents: read
    uses: MauroDataMapper/mauro-ci/.github/workflows/node-publish.yml@7f1066948f95a797f99a160545acf2b7145b886b
    with:
      artifact-name: mdm-ui-dist
      environment-name: mauro-repository-publish
      snapshot-url: https://mauro-repository.com/artifacts-snapshots/mauroDataMapper/mdm-ui
      release-url: https://mauro-repository.com/artifacts/mauroDataMapper/mdm-ui
    secrets:
      REPOSITORY_USERNAME: ${{ secrets.MAURO_SNAPSHOT_REPOSITORY_USERNAME }}
      REPOSITORY_PASSWORD: ${{ secrets.MAURO_SNAPSHOT_REPOSITORY_PASSWORD }}

  notify:
    needs: [ci, lint, publish]
    if: >-
      always()
    permissions: {}
    uses: MauroDataMapper/mauro-ci/.github/workflows/zulip-notify.yml@7f1066948f95a797f99a160545acf2b7145b886b
    with:
      workflow-name: Continuous Integration
      build-result: ${{ needs.ci.result == 'success' && needs.lint.result == 'success' && 'success' || 'failure' }}
      snapshot-result: ${{ needs.publish.result }}
    secrets:
      ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
