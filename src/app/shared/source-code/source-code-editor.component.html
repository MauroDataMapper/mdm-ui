<div class="mdm-source-code-editor">
  <div *ngIf="!inEditMode" class="mdm-source-code-editor__readonly">
    <div class="mdm-source-code-editor__readonly-header">
      <span>{{ selectedLanguageDisplayName }}</span>
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="copied ? 'Copied source code' : 'Copy source code'"
        [matTooltip]="copied ? 'Copied' : 'Copy source code'"
        (click)="copySource()"
      >
        <span
          [ngClass]="copied ? 'fas fa-check' : 'far fa-copy'"
          aria-hidden="true"
        ></span>
      </button>
    </div>
    <pre class="mdm-source-code-editor__readonly-code"><code
      [class]="'language-' + prismLanguage"
      [innerHTML]="highlightedSource"
    ></code></pre>
  </div>

  <div *ngIf="inEditMode" class="mdm-source-code-editor__toolbar">
    <mat-form-field appearance="outline">
      <mat-label>Language</mat-label>
      <mat-select
        [(ngModel)]="language"
        [disabled]="!inEditMode || pinLanguage"
        (selectionChange)="onLanguageChange()"
      >
        <mat-option
          *ngFor="let item of supportedLanguages"
          [value]="item.value"
          >{{ item.displayName }}</mat-option
        >
      </mat-select>
    </mat-form-field>

    <mat-toolbar *ngIf="inEditMode">
      <input
        class="mdm-source-code-editor__file-name"
        matInput
        readonly
        [(ngModel)]="importFileName"
        placeholder="Import a file..."
      />
      <button mat-flat-button color="primary" type="button">
        Browse
      </button>
      <input
        type="file"
        (change)="onFileAdded($event)"
        name="sourceCodeFileUpload"
      />
    </mat-toolbar>
  </div>

  <ace
    *ngIf="inEditMode"
    class="mdm-source-code-editor__ace-editor"
    [mode]="selectedLanguage?.aceValue ?? 'text'"
    [theme]="'github'"
    [value]="source"
    (valueChange)="onSourceChange($event)"
    [config]="editorConfig"
  ></ace>
</div>
